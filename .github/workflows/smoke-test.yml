name: Smoke test

on:
  push:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Docker image
        run: docker build -t dev-portal-pkce:ci .

      - name: Start container
        run: |
          docker run -d --name pkce-smoke -p 3000:3000 \
            -e TENANT_URL=${{ secrets.TENANT_URL }} \
            -e CLIENT_ID=${{ secrets.CLIENT_ID }} \
            -e CLIENT_SECRET=${{ secrets.CLIENT_SECRET }} \
            -e REDIRECT_URI=http://localhost:3000/callback \
            -e RESPONSE_TYPE=code \
            dev-portal-pkce:ci

      - name: Wait for app to respond
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App responded after ${i} attempt(s)"
              exit 0
            fi
            echo "Waiting for app to come up... (attempt ${i}/15)"
            sleep 2
          done
          echo "App did not respond in time"
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker logs pkce-smoke || true

      - name: Stop and remove container
        if: always()
        run: docker rm -f pkce-smoke || true