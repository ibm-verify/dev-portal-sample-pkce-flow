name: E2E

on:
  push:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build Docker image
        run: docker build -t dev-portal-pkce:ci .

      - name: Start container
        run: |
          docker run -d --name pkce-e2e -p 3000:3000 \
            -e TENANT_URL=${{ secrets.TENANT_URL }} \
            -e CLIENT_ID=${{ secrets.CLIENT_ID }} \
            -e CLIENT_SECRET=${{ secrets.CLIENT_SECRET }} \
            -e REDIRECT_URI=http://localhost:3000/callback \
            -e RESPONSE_TYPE=code \
            dev-portal-pkce:ci

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app to respond on http://localhost:3000 ..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is ready after ${i} attempt(s)"
              exit 0
            fi
            echo "  attempt ${i}/30 — retrying in 2s"
            sleep 2
          done
          echo "App did not become ready in time"
          docker logs pkce-e2e
          exit 1

      - name: Run E2E tests
        env:
          APP_URL: http://localhost:3000
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop and remove container
        if: always()
        run: docker rm -f pkce-e2e || true
